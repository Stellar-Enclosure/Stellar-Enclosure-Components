spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: rpc-test-consumer

egon:
  cola:
    component:
      rpc:
        enabled: true
        transport: h2c
        provider:
          enabled: false
        consumer:
          enabled: true
          default-timeout-ms: 3000
          bindings:
            echo-service:
              version: 1
              namespace: ${RPC_TEST_NAMESPACE:rpc-tests}
              service: ${RPC_TEST_SERVICE:rpc-test-provider}
              port: ${RPC_TEST_PORT:19090}
              methods:
                - egon.rpc.test.v1.EchoService/Echo
