spring:
  http:
    converters:
      preferred-json-mapper: jackson2
    codecs:
      preferred-json-mapper: jackson2
  application:
    name: rpc-test-provider

egon:
  cola:
    component:
      rpc:
        enabled: true
        transport: h2c
        provider:
          enabled: true
          bind-address: ${RPC_TEST_BIND_ADDRESS:0.0.0.0}
          port: ${RPC_TEST_PORT:19090}
        consumer:
          enabled: false

rpc:
  test:
    provider-id: provider-default
